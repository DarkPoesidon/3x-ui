name: Release 3X-UI for Docker

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Cheap gate: a package this repository cannot write to used to cost a full
  # build before anyone found out. Opening and cancelling an upload session is
  # the same permission the push needs and costs about a second.
  preflight:
    name: Check GHCR access
    runs-on: ubuntu-latest
    steps:
      - name: Verify GHCR will accept a push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          image=$(echo '${{ github.repository_owner }}/3x-ui' | tr '[:upper:]' '[:lower:]')
          basic=$(printf '%s:%s' '${{ github.actor }}' "$GH_TOKEN" | base64 -w0)
          scope="repository:${image}:pull,push"
          token=$(curl -sS -H "Authorization: Basic $basic" "https://ghcr.io/token?service=ghcr.io&scope=${scope}" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "::warning::GHCR issued no token for ${image}; skipping the preflight"
            exit 0
          fi
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "https://ghcr.io/v2/${image}/blobs/uploads/")
          case "$code" in
            201|202)
              location=$(sed -n 's/^[Ll]ocation: *//p' "$headers" | tr -d '[:space:]')
              if [ -n "$location" ]; then
                curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $token" "$location" || true
              fi
              echo "ghcr.io/${image} accepts pushes from ${{ github.repository }}"
              ;;
            401|403)
              echo "::error::ghcr.io/${image} refuses writes from ${{ github.repository }} (HTTP ${code})"
              echo "The package is linked to another repository, so this one's GITHUB_TOKEN"
              echo "cannot write to it. Grant access at:"
              echo "  https://github.com/users/${{ github.repository_owner }}/packages/container/3x-ui/settings"
              echo "  Manage Actions access -> Add repository -> ${{ github.repository }} -> Write"
              exit 1
              ;;
            *)
              echo "::warning::preflight returned HTTP ${code} for ${image}; continuing to the build"
              ;;
          esac

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # GHCR rejects capitals, and the owner name is not necessarily lower case.
      - name: Resolve the image name
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_IMAGE=ghcr.io/${owner}/3x-ui" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag: the digest is the handle, and the merge job below
      # is what gives these images their names. Attestations stay off so the
      # digest refers to one image and not to an index the merge would nest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-arch tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the image name
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_IMAGE=ghcr.io/${owner}/3x-ui" >> "$GITHUB_ENV"

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect what was published
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
